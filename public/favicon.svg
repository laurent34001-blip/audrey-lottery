<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient)"/>
  
  <!-- Lottery ball circles -->
  <circle cx="50" cy="35" r="12" fill="white" opacity="0.9"/>
  <circle cx="35" cy="58" r="10" fill="white" opacity="0.8"/>
  <circle cx="65" cy="58" r="10" fill="white" opacity="0.8"/>
  <circle cx="50" cy="72" r="8" fill="white" opacity="0.7"/>
  
  <!-- Numbers -->
  <text x="50" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">B</text>
  <text x="35" y="62" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#3b82f6" text-anchor="middle">L</text>
  <text x="65" y="62" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#3b82f6" text-anchor="middle">T</text>
</svg>
